name: Auto Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: auto-shorts
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify runtime
        run: |
          python -c "import edge_tts, requests, pytrends; print('Core imports OK')"
          python -m py_compile main.py uploader.py

      - name: Check YouTube secrets
        run: |
          test -n "$GOOGLE_CREDENTIALS" || { echo "::error::Missing GOOGLE_CREDENTIALS repository secret"; exit 1; }
          test -n "$GOOGLE_TOKEN" || { echo "::error::Missing GOOGLE_TOKEN repository secret"; exit 1; }
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS || secrets.GOOGLECRED }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN || secrets.GOOGLETOKEN }}

      - name: Create short video
        run: python main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXEL }}

      - name: Upload to YouTube
        run: python uploader.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS || secrets.GOOGLECRED }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN || secrets.GOOGLETOKEN }}
